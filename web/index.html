<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Evidence Digest — new peer-reviewed evidence, by topic</title>
    <meta
      name="description"
      content="Evidence Digest tracks newly indexed peer-reviewed studies across medical specialties and lets you follow only the topics you care about. Free, no account, no tracking."
    />

    <!-- Self-contained inline SVG favicon: a plain rounded monogram, no external request. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a5f'/%3E%3Cpath d='M20 20h16a8 8 0 0 1 0 16H24v8h-4V20zm4 4v8h12a4 4 0 0 0 0-8H24z' fill='%23f4f1ea'/%3E%3Ccircle cx='46' cy='46' r='3.5' fill='%2357a891'/%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evidence Digest" />
    <meta property="og:title" content="Evidence Digest — new peer-reviewed evidence, by topic" />
    <meta
      property="og:description"
      content="Pick the medical topics you care about and see newly published peer-reviewed evidence, ranked transparently. Free, no account, no tracking, no third-party requests."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Evidence Digest" />
    <meta
      name="twitter:description"
      content="Newly published peer-reviewed evidence, organized by topic. Free, no account, no tracking."
    />
    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1420" media="(prefers-color-scheme: dark)" />

    <!--
      Theme bootstrap: read the persisted choice (or system preference) and stamp it on <html>
      before React mounts, so there is no flash of the wrong theme. This is the one inline
      script in the app; it touches only localStorage and a class name, nothing network-facing.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ed-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
