version: 2

# Grouping notes, because the obvious configuration is wrong for this project.
#
# The first version of this file grouped only `minor` and `patch` updates, which
# left every MAJOR bump to open its own pull request. On the very first Dependabot
# run that produced 12 pull requests within minutes of the initial commit — react-dom,
# react-router-dom, vitest, typescript, and four separate Actions bumps, each on its
# own branch. For a solo-maintained project that is pure noise: it buries real work
# in review, and each merge triggers a Pages rebuild.
#
# So each ecosystem now collapses into a SINGLE grouped pull request covering all
# update types, on a monthly cadence. Worst case is four pull requests a month and
# typically one or two. A grouped major bump still has to be read before merging,
# but CI (typecheck + build + the full pipeline and worker test suites) runs on the
# group, so a breaking upgrade fails loudly in one place rather than in five.
#
# If a security advisory lands, Dependabot opens that separately and immediately
# regardless of this schedule — grouping does not delay security updates.

updates:
  # web/ — Vite + React + TypeScript SPA.
  - package-ecosystem: 'npm'
    directory: '/web'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      web-dependencies:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(web)'
    labels: ['dependencies', 'web']

  # worker/ — Cloudflare Worker (email digests via D1 + Brevo).
  - package-ecosystem: 'npm'
    directory: '/worker'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      worker-dependencies:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(worker)'
    labels: ['dependencies', 'worker']

  # Workflow files in .github/workflows/ pin third-party Actions by tag (e.g.
  # actions/checkout@v4) — keep those current too. Worth staying on top of: GitHub
  # periodically retires the Node runtime older Actions target, and a stale pin
  # starts emitting deprecation warnings on every harvest run.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies', 'ci']

  # The composite action itself (.github/actions/build-site/action.yml) also pins
  # Actions by tag and is not covered by the top-level entry above — Dependabot
  # treats a directory containing an action.yml as its own scan root.
  - package-ecosystem: 'github-actions'
    directory: '/.github/actions/build-site'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies', 'ci']
