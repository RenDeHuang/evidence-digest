name: Bug report
description: Something in the site, the feeds, or the email digest is broken or behaving unexpectedly.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If this is about a study landing in
        the wrong topic, please use the **Topic misclassification** template instead —
        it collects exactly the fields needed to fix a classification rule.
        If this is about a journal that's missing or has a wrong PubMed abbreviation,
        please use the **Journal request / correction** template instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots help a lot.
      placeholder: e.g. "The Cardiology topic page shows a blank list even though the Sources page says there are 84 studies."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL (if applicable)
      placeholder: https://muhammadali-k.github.io/evidence-digest/topics/cardio-heart-failure
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and device (if this is a web UI bug)
      placeholder: e.g. Safari 18 on iPhone 15, Chrome 128 on Windows 11
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Console errors, links to a related GitHub Actions run, etc.
    validations:
      required: false
